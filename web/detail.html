<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查看图书信息</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <h1 class="page-title">查看图书信息</h1>

    <!-- 详情页所有字段均为只读 -->
    <div class="form-grid">
      <label for="bookCode">图书编号:</label>
      <input type="text" id="bookCode" readonly>

      <label for="bookName">图书名称:</label>
      <input type="text" id="bookName" readonly>

      <label for="bookType">图书类型:</label>
      <input type="text" id="bookType" readonly>

      <label for="bookAuthor">作者:</label>
      <input type="text" id="bookAuthor" readonly>

      <label for="publishPress">出版社:</label>
      <input type="text" id="publishPress" readonly>

      <label for="borrowed">是否借阅:</label>
      <select id="borrowed" disabled>
        <option value="0">未借阅</option>
        <option value="1">已借阅</option>
      </select>

      <label for="createdBy">入库人:</label>
      <input type="text" id="createdBy" readonly>

      <label for="creationTime">入库时间:</label>
      <input type="text" id="creationTime" readonly>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-primary" id="btn-back">返回</button>
    </div>
  </div>

  <script src="vendor/jquery-3.7.1.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
